{% extends "base.html" %}

{% block title %}Meta por Setor - Multimarks Analytics{% endblock %}

{% block content %}
<style>
.meta-section {
    background: linear-gradient(135deg, rgba(30, 30, 45, 0.95) 0%, rgba(20, 20, 35, 0.98) 100%);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
}

.meta-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.8), rgba(236, 72, 153, 0.8), transparent);
}

.meta-section-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.meta-section-title i { color: #a78bfa; }

/* ── Planilha banner ───────────────────────────────────── */
.planilha-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(74, 222, 128, 0.08);
    border: 1px solid rgba(74, 222, 128, 0.25);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: #4ade80;
    margin-bottom: 20px;
}

.planilha-banner i { flex-shrink: 0; }

/* ── Tabela ────────────────────────────────────────────── */
.meta-table-wrap { overflow-x: auto; }

.meta-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.82rem;
}

.meta-table thead th {
    background: rgba(139, 92, 246, 0.1);
    color: #a78bfa;
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid rgba(139, 92, 246, 0.3);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 5;
}

.meta-table tbody tr { transition: background 0.15s; }
.meta-table tbody tr:hover { background: rgba(139, 92, 246, 0.06); }

.meta-table tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    color: #e2e8f0;
    white-space: nowrap;
}

.meta-table tbody tr:last-child td { border-bottom: none; }

/* Célula de valor com linha de meta */
.cell-valor { font-family: var(--font-mono); }
.cell-real  { font-weight: 600; }
.cell-meta  { font-size: 0.7rem; color: #64748b; margin-top: 1px; }
.cell-pct   { font-size: 0.7rem; margin-top: 1px; }

/* Colorização da % por desempenho */
.pct-ok   { color: #4ade80; }
.pct-near { color: #fbbf24; }
.pct-bad  { color: #f87171; }

/* ── Badges ────────────────────────────────────────────── */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
}

.badge-bateu   { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.badge-quase   { background: rgba(251,191,36,0.15);  color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
.badge-longe   { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
.badge-sem-meta{ background: rgba(100,116,139,0.15); color: #64748b; border: 1px solid rgba(100,116,139,0.2); font-style: italic; }


/* ── Filtros ───────────────────────────────────────────── */
.filtros-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 0;
    align-items: flex-end;
}

.filtro-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 180px;
}

.filtro-group label {
    font-size: 0.72rem;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.filtro-group select {
    background: #1e1e2d;
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 8px;
    color: #f8fafc;
    padding: 8px 12px;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
}

.filtro-group select option {
    background-color: #1e1e2d;
    color: #f8fafc;
}

.filtro-group input[type="date"] {
    background: #1e1e2d;
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 8px;
    color: #f8fafc;
    padding: 7px 12px;
    font-size: 0.85rem;
    outline: none;
    color-scheme: dark;
}

/* ── Envio Slack: modo diário ───────────────────────────── */
.envio-info {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.8rem;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.3);
    color: #fbbf24;
}
.envio-info.warn {
    background: rgba(248, 113, 113, 0.08);
    border-color: rgba(248, 113, 113, 0.35);
    color: #f87171;
}
.modo-badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.3);
    color: #fbbf24;
    white-space: nowrap;
}
.modo-badge.ciclo {
    background: rgba(139, 92, 246, 0.12);
    border-color: rgba(139, 92, 246, 0.3);
    color: #a78bfa;
}
.cell-ritmo { font-size: 0.7rem; color: #fbbf24; margin-top: 2px; white-space: nowrap; }


/* ── Resumo cards ──────────────────────────────────────── */
.legenda {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 0.78rem;
    color: #94a3b8;
    align-items: center;
}

.resumo-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.resumo-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
}

.resumo-card .num {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: var(--font-mono);
}

.resumo-card .lbl { font-size: 0.72rem; color: #94a3b8; margin-top: 4px; }

.num-bateu { color: #4ade80; }
.num-quase { color: #fbbf24; }
.num-longe { color: #f87171; }
.num-total { color: #a78bfa; }

.empty-state { text-align: center; padding: 60px 20px; color: #475569; }
.empty-state p { margin-top: 8px; font-size: 0.9rem; }

</style>

<div class="page-header">
    <h1 class="page-title">Meta por Setor</h1>
    <p class="page-subtitle">Acompanhe o desempenho de cada setor em relação às metas</p>
</div>

<div x-data="metaSetor()" x-init="init()">

    <!-- Sem dados -->
    <template x-if="!hasData">
        <div class="meta-section">
            <div class="empty-state">
                <i data-lucide="upload" style="width:48px;height:48px;color:#475569;margin-bottom:12px;"></i>
                <p>Carregue uma planilha no Dashboard para visualizar os setores.</p>
            </div>
        </div>
    </template>

    <template x-if="hasData">
        <div>
            <!-- Filtros -->
            <div class="meta-section">
                <div class="meta-section-title">
                    <i data-lucide="filter" style="width:18px;height:18px;"></i>
                    Filtros
                </div>
                <div class="filtros-row">
                    <div class="filtro-group">
                        <label>Ciclo</label>
                        <select x-model="filtros.ciclo" @change="buscarDados(); carregarPosicao()">
                            <option value="">Todos os ciclos</option>
                            <template x-for="c in opcoes.ciclos" :key="c">
                                <option :value="c" x-text="c"></option>
                            </template>
                        </select>
                    </div>
                    <div class="filtro-group">
                        <label>Gerência</label>
                        <select x-model="filtros.gerencia" @change="buscarDados()">
                            <option value="">Todas as gerências</option>
                            <template x-for="g in opcoes.gerencias" :key="g">
                                <option :value="g" x-text="g"></option>
                            </template>
                        </select>
                    </div>
                    <!-- Tipo de envio Slack (escolha da gerência; fica salvo no navegador) -->
                    <div class="filtro-group">
                        <label>Envio Slack</label>
                        <select x-model="envio.modo" @change="mudarModoEnvio()" title="Meta do ciclo: resultado geral vs. meta. Meta diária: onde deveria estar hoje e quanto precisa por dia útil.">
                            <option value="auto">🤖 Automático (pela planilha)</option>
                            <option value="ciclo">📊 Meta do ciclo (geral)</option>
                            <option value="diario">⏱️ Meta diária (ritmo do dia)</option>
                        </select>
                    </div>
                    <div class="filtro-group" x-show="modoEfetivo() === 'diario'">
                        <label>Data de referência</label>
                        <input type="date" x-model="envio.dataRef" @change="buscarDados(); carregarPosicao()" title="Dia considerado como 'hoje' no cálculo (padrão: hoje)">
                    </div>
                </div>
                <div class="envio-info" x-show="modoEfetivo() === 'diario'" :class="{ warn: !!posicaoErro }" x-text="posicaoTexto()"></div>
                <div class="envio-info warn" x-show="modoEfetivo() !== 'diario' && planilhaSoDoDia()"
                     x-text="periodo ? `⚠️ A planilha carregada cobre só ${fmtDataBR(periodo.data_min)} → ${fmtDataBR(periodo.data_max)} — não é o acumulado do ciclo. Para ela, use o envio “Meta diária” (ou “Automático”); para a meta do ciclo, suba a planilha acumulada.` : ''"></div>
            </div>

            <!-- Tabela de desempenho -->
            <div class="meta-section">
                <div class="meta-section-title">
                    <i data-lucide="bar-chart-2" style="width:18px;height:18px;"></i>
                    Desempenho por Setor
                    <span style="margin-left:auto;display:flex;align-items:center;gap:10px;">
                        <span style="font-size:0.8rem;font-weight:400;color:#64748b;" x-text="dados.length + ' setores'"></span>
                        <span class="modo-badge" :class="{ ciclo: modoEfetivo() !== 'diario' }" x-text="badgeEnvio()"></span>
                        <button @click="enviarSlackTodos($el)" title="Enviar para todas as supervisoras via Slack"
                            style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(74,21,75,0.4),rgba(123,47,190,0.4));
                                   border:1px solid rgba(123,47,190,0.5);border-radius:8px;padding:5px 12px;
                                   color:#e2e8f0;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;"
                            onmouseover="this.style.background='linear-gradient(135deg,rgba(74,21,75,0.6),rgba(123,47,190,0.6))'"
                            onmouseout="this.style.background='linear-gradient(135deg,rgba(74,21,75,0.4),rgba(123,47,190,0.4))'">
                            💬 Enviar para Todas
                        </button>
                        <button @click="exportarExcel($el)" title="Exportar metas para Excel (somente setores com meta cadastrada)"
                            style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(16,185,129,0.3),rgba(5,150,105,0.3));
                                   border:1px solid rgba(16,185,129,0.4);border-radius:8px;padding:5px 12px;
                                   color:#e2e8f0;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;"
                            onmouseover="this.style.background='linear-gradient(135deg,rgba(16,185,129,0.5),rgba(5,150,105,0.5))'"
                            onmouseout="this.style.background='linear-gradient(135deg,rgba(16,185,129,0.3),rgba(5,150,105,0.3))'">
                            <i data-lucide="file-spreadsheet" style="width:13px;height:13px;"></i>
                            Exportar Excel
                        </button>
                        <button @click="imprimirTodos()" title="Imprimir todos os setores"
                            style="display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(139,92,246,0.3),rgba(236,72,153,0.3));
                                   border:1px solid rgba(139,92,246,0.4);border-radius:8px;padding:5px 12px;
                                   color:#e2e8f0;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.2s;"
                            onmouseover="this.style.background='linear-gradient(135deg,rgba(139,92,246,0.5),rgba(236,72,153,0.5))'"
                            onmouseout="this.style.background='linear-gradient(135deg,rgba(139,92,246,0.3),rgba(236,72,153,0.3))'">
                            <i data-lucide="printer" style="width:13px;height:13px;"></i>
                            Imprimir Todos
                        </button>
                    </span>
                </div>

                <!-- Resumo contadores -->
                <div class="resumo-cards">
                    <div class="resumo-card">
                        <div class="num num-total" x-text="dados.length"></div>
                        <div class="lbl">Total Setores</div>
                    </div>
                    <div class="resumo-card">
                        <div class="num num-bateu" x-text="contagem.bateu"></div>
                        <div class="lbl">Bateram a Meta</div>
                    </div>
                    <div class="resumo-card">
                        <div class="num num-quase" x-text="contagem.quase"></div>
                        <div class="lbl">Quase Lá</div>
                    </div>
                    <div class="resumo-card">
                        <div class="num num-longe" x-text="contagem.longe"></div>
                        <div class="lbl">Precisa Melhorar</div>
                    </div>
                    <div class="resumo-card">
                        <div class="num" style="color:#64748b;" x-text="contagem.sem_meta"></div>
                        <div class="lbl">Sem Meta Definida</div>
                    </div>
                </div>

                <!-- Legenda -->
                <div class="legenda">
                    <span style="color:#4ade80;">&#9679;</span> Parabéns, meta batida! 🎉 (≥ 100% da meta)
                    <span style="color:#fbbf24;">&#9679;</span> Falta pouco, você consegue! 💪 (≥ 60% da meta)
                    <span style="color:#f87171;">&#9679;</span> Bora virar o jogo! 🚀 (&lt; 60% da meta)
                </div>

                <!-- Loading -->
                <template x-if="loading">
                    <div style="text-align:center;padding:40px;color:#64748b;">Carregando...</div>
                </template>

                <!-- Tabela -->
                <template x-if="!loading">
                    <div class="meta-table-wrap">
                        <table class="meta-table">
                            <thead>
                                <tr>
                                    <th style="width:36px;"></th>
                                    <th>Setor</th>
                                    <th>Supervisora</th>
                                    <th>Status</th>
                                    <th>Receita</th>
                                    <th>Clientes Ativos</th>
                                    <th>RPA</th>
                                    <th>Multi %</th>
                                    <th>Cabelo %</th>
                                    <th>Make %</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="s in dados" :key="s.setor">
                                    <tr>
                                        <!-- Botão envio Slack -->
                                        <td style="text-align:center;padding:6px;">
                                            <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
                                                <button @click="enviarSlackSetor(s, $el)" title="Enviar via Slack"
                                                    style="background:none;border:1px solid rgba(74,21,75,0.5);border-radius:6px;
                                                           padding:4px 8px;cursor:pointer;color:#c084fc;transition:all 0.2s;font-size:14px;"
                                                    onmouseover="this.style.background='rgba(74,21,75,0.3)'"
                                                    onmouseout="this.style.background='none'">💬</button>
                                                <span x-show="enviados[s.setor]" title="Enviado via Slack"
                                                    style="color:#4ade80;font-size:13px;font-weight:700;">✓</span>
                                            </div>
                                        </td>

                                        <td style="font-weight:600;color:#f8fafc;max-width:200px;white-space:normal;" x-text="s.setor"></td>
                                        <td style="color:#94a3b8;font-size:0.78rem;" x-text="s.supervisora || '—'"></td>
                                        <td>
                                            <span :class="badgeClass(s._status)" class="badge">
                                                <span x-text="badgeIcon(s._status)"></span>
                                                <span x-text="badgeLabel(s._status)"></span>
                                            </span>
                                        </td>

                                        <!-- Receita -->
                                        <td class="cell-valor">
                                            <div class="cell-real" x-text="fmt.currency(s.receita)"></div>
                                            <template x-if="metaEfetiva(s, 'receita') !== null">
                                                <div>
                                                    <div class="cell-meta" x-text="'meta: ' + fmt.currency(metaEfetiva(s, 'receita'))"></div>
                                                    <div :class="pctClass(s.receita, metaEfetiva(s,'receita'))" class="cell-pct" x-text="pctStr(s.receita, metaEfetiva(s,'receita'))"></div>
                                                    <div class="cell-ritmo" x-show="modoEfetivo() === 'diario' && posicao" x-text="ritmoStr(s, 'receita', 'currency')"></div>
                                                    <div class="cell-ritmo" style="color:#93c5fd;" x-show="modoEfetivo() === 'diario' && posicao && s.hoje" x-text="hojeStr(s, 'receita', 'currency')"></div>
                                                </div>
                                            </template>
                                        </td>

                                        <!-- Clientes Ativos -->
                                        <td class="cell-valor">
                                            <div class="cell-real" x-text="fmt.number(s.clientes_ativos)"></div>
                                            <template x-if="metaEfetiva(s, 'clientes_ativos') !== null">
                                                <div>
                                                    <div class="cell-meta" x-text="'meta: ' + fmt.number(metaEfetiva(s, 'clientes_ativos'))"></div>
                                                    <div :class="pctClass(s.clientes_ativos, metaEfetiva(s,'clientes_ativos'))" class="cell-pct" x-text="pctStr(s.clientes_ativos, metaEfetiva(s,'clientes_ativos'))"></div>
                                                </div>
                                            </template>
                                        </td>

                                        <!-- RPA -->
                                        <td class="cell-valor">
                                            <div class="cell-real" x-text="fmt.currency(s.rpa)"></div>
                                            <template x-if="metaEfetiva(s, 'rpa') !== null">
                                                <div>
                                                    <div class="cell-meta" x-text="'meta: ' + fmt.currency(metaEfetiva(s, 'rpa'))"></div>
                                                    <div :class="pctClass(s.rpa, metaEfetiva(s,'rpa'))" class="cell-pct" x-text="pctStr(s.rpa, metaEfetiva(s,'rpa'))"></div>
                                                </div>
                                            </template>
                                        </td>

                                        <!-- Multi % -->
                                        <td class="cell-valor">
                                            <div class="cell-real" x-text="fmt.percent(s.percent_multimarcas)"></div>
                                            <template x-if="metaEfetiva(s, 'percent_multimarcas') !== null">
                                                <div>
                                                    <div class="cell-meta" x-text="'meta: ' + fmt.percent(metaEfetiva(s, 'percent_multimarcas'))"></div>
                                                    <div :class="pctClass(s.percent_multimarcas, metaEfetiva(s,'percent_multimarcas'))" class="cell-pct" x-text="pctStr(s.percent_multimarcas, metaEfetiva(s,'percent_multimarcas'))"></div>
                                                    <!-- meta diária: em clientes multimarca (meta Qtd da planilha) -->
                                                    <div class="cell-ritmo" x-show="modoEfetivo() === 'diario' && posicao" x-text="ritmoStr(s, 'clientes_multimarcas', 'number')"></div>
                                                    <div class="cell-ritmo" style="color:#93c5fd;" x-show="modoEfetivo() === 'diario' && posicao && s.hoje" x-text="hojeStr(s, 'clientes_multimarcas', 'number')"></div>
                                                </div>
                                            </template>
                                        </td>

                                        <!-- Cabelo % -->
                                        <td class="cell-valor">
                                            <div class="cell-real" x-text="fmt.percent(s.percent_cabelos)"></div>
                                            <template x-if="metaEfetiva(s, 'percent_cabelos') !== null">
                                                <div>
                                                    <div class="cell-meta" x-text="'meta: ' + fmt.percent(metaEfetiva(s, 'percent_cabelos'))"></div>
                                                    <div :class="pctClass(s.percent_cabelos, metaEfetiva(s,'percent_cabelos'))" class="cell-pct" x-text="pctStr(s.percent_cabelos, metaEfetiva(s,'percent_cabelos'))"></div>
                                                    <!-- meta diária: em clientes IAF Cabelo (meta Qtd da planilha) -->
                                                    <div class="cell-ritmo" x-show="modoEfetivo() === 'diario' && posicao" x-text="ritmoStr(s, 'clientes_cabelos', 'number')"></div>
                                                    <div class="cell-ritmo" style="color:#93c5fd;" x-show="modoEfetivo() === 'diario' && posicao && s.hoje" x-text="hojeStr(s, 'clientes_cabelos', 'number')"></div>
                                                </div>
                                            </template>
                                        </td>

                                        <!-- Make % -->
                                        <td class="cell-valor">
                                            <div class="cell-real" x-text="fmt.percent(s.percent_make)"></div>
                                            <template x-if="metaEfetiva(s, 'percent_make') !== null">
                                                <div>
                                                    <div class="cell-meta" x-text="'meta: ' + fmt.percent(metaEfetiva(s, 'percent_make'))"></div>
                                                    <div :class="pctClass(s.percent_make, metaEfetiva(s,'percent_make'))" class="cell-pct" x-text="pctStr(s.percent_make, metaEfetiva(s,'percent_make'))"></div>
                                                    <!-- meta diária: em clientes IAF Make (meta Qtd da planilha) -->
                                                    <div class="cell-ritmo" x-show="modoEfetivo() === 'diario' && posicao" x-text="ritmoStr(s, 'clientes_make', 'number')"></div>
                                                    <div class="cell-ritmo" style="color:#93c5fd;" x-show="modoEfetivo() === 'diario' && posicao && s.hoje" x-text="hojeStr(s, 'clientes_make', 'number')"></div>
                                                </div>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
{% endblock %}

{% block scripts %}
<script>
function metaSetor() {
    return {
        hasData: {{ 'true' if has_data else 'false' }},
        loading: false,
        dados: [],               // setores com métricas reais + meta_planilha
        opcoes: { ciclos: [], gerencias: [] },
        filtros: { ciclo: '', gerencia: '' },
        enviados: {},            // setor → true após envio Slack bem-sucedido

        // Tipo de envio Slack escolhido pela gerência: 'ciclo' (meta geral) ou
        // 'diario' (ritmo do dia). Fica salvo no navegador.
        envio: { modo: 'auto', dataRef: '' },   // 'auto' = decide pela planilha (só-dia → diária, acumulada → ciclo)
        posicao: null,           // posição no ciclo (dia útil X de Y) — só no modo diário
        posicaoErro: '',
        periodo: null,           // datas cobertas pela planilha (só-dia vs acumulado) — modo diário
        _posSeq: 0,              // sequência de carregarPosicao() (descarta respostas velhas)

        contagem: { bateu: 0, quase: 0, longe: 0, sem_meta: 0 },

        fmt: {
            currency(v) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
            },
            number(v) {
                return new Intl.NumberFormat('pt-BR').format(v || 0);
            },
            percent(v) {
                return (v || 0).toFixed(1) + '%';
            },
        },

        // Retorna a meta da planilha para o campo
        metaEfetiva(setor, campo) {
            if (setor.meta_planilha && setor.meta_planilha[campo] > 0) {
                return setor.meta_planilha[campo];
            }
            return null;
        },

        async init() {
            this.envio.dataRef = this.hojeISO();
            try {
                const salvo = localStorage.getItem('metas_modo_envio');
                if (salvo === 'auto' || salvo === 'ciclo' || salvo === 'diario') this.envio.modo = salvo;
            } catch (e) {}
            if (!this.hasData) return;
            await Promise.all([this.carregarOpcoes(), this.buscarDados()]);
            await this.carregarPosicao();
        },

        hojeISO() {
            const d = new Date();
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        },

        fmtDataBR(iso) {
            if (!iso) return '—';
            const [y, m, d] = String(iso).split('-');
            return `${d}/${m}/${y}`;
        },

        // Ciclo usado no envio diário: o do filtro ou, sem filtro, o único da planilha.
        cicloEnvio() {
            if (this.filtros.ciclo) return this.filtros.ciclo;
            if (this.opcoes.ciclos.length === 1) return this.opcoes.ciclos[0];
            return '';
        },

        mudarModoEnvio() {
            try { localStorage.setItem('metas_modo_envio', this.envio.modo); } catch (e) {}
            this.carregarPosicao();
        },

        async carregarPosicao() {
            // Token de sequência: trocas rápidas de filtro/modo/data disparam várias
            // chamadas; só a última pode escrever o estado.
            const seq = ++this._posSeq;
            this.posicao = null;
            this.posicaoErro = '';
            this.periodo = null;
            const ciclo = this.cicloEnvio();
            const params = new URLSearchParams();
            if (ciclo)              params.set('ciclo',    ciclo);
            if (this.envio.dataRef) params.set('data_ref', this.envio.dataRef);

            // Período da planilha vale nos dois modos: avisa quando ela é só do dia.
            try {
                const r = await fetch('/api/metas/periodo-planilha?' + params);
                const per = r.ok ? await r.json() : null;
                if (seq !== this._posSeq) return;
                this.periodo = per;
            } catch (e) {}

            if (this.modoEfetivo() !== 'diario') return;
            if (!ciclo) {
                this.posicaoErro = 'A planilha tem mais de um ciclo — selecione um ciclo no filtro para a meta diária.';
                return;
            }
            try {
                const res  = await fetch('/api/metas/calendario?' + params);
                const data = await res.json();
                if (seq !== this._posSeq) return;
                if (!res.ok) { this.posicaoErro = data.detail || 'Ciclo fora do calendário'; return; }
                this.posicao = data;
                if (data.status === 'encerrado')  this.posicaoErro = `Ciclo ${data.ciclo} já encerrado — use o envio por ciclo.`;
                else if (data.status === 'antes') this.posicaoErro = `Ciclo ${data.ciclo} ainda não começou (início ${this.fmtDataBR(data.inicio)}).`;
            } catch (e) {
                this.posicaoErro = 'Não foi possível carregar o calendário do ciclo.';
            }
        },

        // Planilha só do dia carregada com envio "meta do ciclo" → números distorcidos
        planilhaSoDoDia() {
            const p = this.periodo;
            return !!(p && p.tem_data && p.acumulado_valido === false);
        },

        // Modo que realmente vai no envio. 'auto' decide pela planilha carregada:
        // só do dia → meta diária; acumulada (ou sem data) → meta do ciclo.
        modoEfetivo() {
            if (this.envio.modo === 'auto') return this.planilhaSoDoDia() ? 'diario' : 'ciclo';
            return this.envio.modo;
        },

        badgeEnvio() {
            const m = this.modoEfetivo() === 'diario' ? '⏱️ envio: meta diária' : '📊 envio: meta do ciclo';
            return this.envio.modo === 'auto' ? `${m} (auto)` : m;
        },

        // Resumo do que a planilha carregada permite no envio diário
        periodoTexto() {
            const p = this.periodo;
            if (!p || !p.tem_data) return 'planilha sem DataCaptacao → só acumulado do ciclo';
            const faixa = p.data_min === p.data_max
                ? `só ${this.fmtDataBR(p.data_min)}`
                : `${this.fmtDataBR(p.data_min)} → ${this.fmtDataBR(p.data_max)} (${p.n_dias} dias)`;
            const rec = p.dia_recorte ? `recorte "hoje" = ${this.fmtDataBR(p.dia_recorte)}` : 'sem vendas até a data de referência';
            const acc = p.acumulado_valido
                ? 'acumulado do ciclo ✓'
                : 'só o resultado do dia (planilha não cobre o ciclo desde o início)';
            return `planilha ${faixa} · ${rec} · ${acc}`;
        },

        posicaoTexto() {
            if (this.posicaoErro) return '⚠️ ' + this.posicaoErro;
            const p = this.posicao;
            if (!p) return '⏱️ Carregando calendário do ciclo...';
            const ext  = p.status === 'extensao' ? ' · extensão do ciclo' : '';
            const hoje = p.hoje_util ? 'incl. hoje' : 'hoje não é dia útil';
            return `⏱️ Meta diária · Ciclo ${p.ciclo} (${this.fmtDataBR(p.inicio)} → ${this.fmtDataBR(p.fim)}, +2 de extensão)`
                 + ` · dia útil ${p.dia_atual} de ${p.dias_uteis} · faltam ${p.dias_restantes} dias úteis (${hoje})${ext}`
                 + ` — ${this.periodoTexto()}`;
        },

        // "precisa R$ X/dia" para os indicadores acumulativos (modo diário)
        ritmoStr(s, campo, tipo) {
            const p = this.posicao;
            const meta = this.metaEfetiva(s, campo);
            if (!p || meta === null) return '';
            const falta = Math.max(0, meta - (s[campo] || 0));
            if (falta <= 0) return '✓ meta batida';
            if (!p.dias_restantes) return 'sem dias úteis restantes';
            const porDia = falta / p.dias_restantes;
            const v = tipo === 'currency' ? this.fmt.currency(porDia) : porDia.toFixed(1).replace('.', ',');
            return `precisa ${v}/dia`;
        },

        // "hoje: R$ X (meta do dia R$ Y)" — vendas do dia de recorte vs meta do ciclo ÷ dias úteis
        hojeStr(s, campo, tipo) {
            const p = this.posicao;
            const meta = this.metaEfetiva(s, campo);
            if (!p || !s.hoje || meta === null || !p.dias_uteis) return '';
            const real = s.hoje[campo] || 0;
            const metaDia = meta / p.dias_uteis;
            const f = v => tipo === 'currency' ? this.fmt.currency(v) : (Number.isInteger(v) ? String(v) : v.toFixed(1).replace('.', ','));
            const ok = real >= metaDia ? '✓' : '·';
            return `hoje ${this.fmtDataBR(s.hoje.data).slice(0, 5)}: ${f(real)} ${ok} meta/dia ${f(metaDia)}`;
        },

        podeEnviar() {
            if (this.modoEfetivo() !== 'diario') {
                // Só acontece se a gerência forçar "Meta do ciclo" com planilha só do dia:
                // bloqueia (o servidor também recusa) — os números sairiam distorcidos.
                if (this.planilhaSoDoDia()) {
                    const p = this.periodo;
                    alert(`A planilha carregada cobre só ${this.fmtDataBR(p.data_min)} → ${this.fmtDataBR(p.data_max)} — `
                        + `não é o acumulado do ciclo, e a META DO CICLO sairia distorcida.\n\n`
                        + `Use o envio "Meta diária" (ou "Automático") para essa planilha, ou suba a planilha acumulada.`);
                    return false;
                }
                return true;
            }
            if (this.posicaoErro || !this.posicao) {
                alert(this.posicaoErro || 'Calendário do ciclo ainda não carregado.');
                return false;
            }
            return true;
        },

        // Corpo do POST /api/slack/enviar-meta para um setor, no modo escolhido.
        montarPayload(s) {
            const mp = s.meta_planilha || {};
            const dados = {
                receita:              s.receita || 0,
                meta_receita:         mp.receita || null,
                clientes_ativos:      s.clientes_ativos || 0,
                meta_ativo:           mp.clientes_ativos || null,
                rpa:                  s.rpa || 0,
                meta_rpa:             mp.rpa || null,
                multimarca:           s.percent_multimarcas || 0,
                meta_multimarca:      mp.percent_multimarcas || null,
                cabelos:              s.percent_cabelos || 0,
                meta_cabelos:         mp.percent_cabelos || null,
                make:                 s.percent_make || 0,
                meta_make:            mp.percent_make || null,
                // contagens — usadas na meta diária (quantos clientes faltam por dia)
                clientes_multimarcas: s.clientes_multimarcas || 0,
                meta_multimarca_qtd:  mp.clientes_multimarcas || null,
                clientes_cabelos:     s.clientes_cabelos || 0,
                meta_cabelos_qtd:     mp.clientes_cabelos || null,
                clientes_make:        s.clientes_make || 0,
                meta_make_qtd:        mp.clientes_make || null,
                // recorte do dia + datas da planilha — só o envio diário usa
                hoje:                 s.hoje || null,
                planilha:             this.periodo || null,
            };
            return {
                supervisora: s.supervisora || '',
                setor:       s.setor,
                dados,
                modo:        this.modoEfetivo(),
                ciclo:       this.cicloEnvio(),
                data_ref:    this.envio.dataRef || null,
            };
        },

        async carregarOpcoes() {
            try {
                const res = await fetch('/api/filtros');
                const data = await res.json();
                this.opcoes.ciclos    = data.ciclos    || [];
                this.opcoes.gerencias = data.gerencias || [];
            } catch (e) {
                console.error('Erro ao carregar opções:', e);
            }
        },

        async buscarDados() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.filtros.ciclo)    params.set('ciclos',    this.filtros.ciclo);
                if (this.filtros.gerencia) params.set('gerencias', this.filtros.gerencia);
                // Recorte "hoje" de cada setor (usado na meta diária); inofensivo no modo ciclo
                if (this.envio.dataRef)    params.set('dia',       this.envio.dataRef);

                const res  = await fetch('/api/metas/por-setor?' + params);
                this.dados = await res.json();
                this.calcularStatus();
            } catch (e) {
                console.error('Erro ao buscar dados:', e);
            } finally {
                this.loading = false;
            }
        },

        // Pior % atingida entre os indicadores que têm meta efetiva
        piorPct(setor) {
            const campos = [
                'receita','clientes_ativos','rpa',
                'percent_multimarcas',
                'percent_cabelos',
                'percent_make',
            ];
            let pior = Infinity, temMeta = false;
            for (const campo of campos) {
                const meta = this.metaEfetiva(setor, campo);
                if (meta !== null && meta > 0) {
                    temMeta = true;
                    const p = (setor[campo] / meta) * 100;
                    if (p < pior) pior = p;
                }
            }
            return temMeta ? pior : null;
        },

        calcularStatus() {
            let bateu = 0, quase = 0, longe = 0, sem_meta = 0;

            this.dados = this.dados.map(s => {
                const pct = this.piorPct(s);
                let status;
                if (pct === null)    { status = 'sem_meta'; sem_meta++; }
                else if (pct >= 100) { status = 'bateu';    bateu++;    }
                else if (pct >= 60)  { status = 'quase';    quase++;    }
                else                 { status = 'longe';    longe++;    }
                return { ...s, _status: status };
            });

            // Ordenar: bateu > quase > longe > sem_meta
            const ordem = { bateu: 0, quase: 1, longe: 2, sem_meta: 3 };
            this.dados.sort((a, b) => ordem[a._status] - ordem[b._status]);

            this.contagem = { bateu, quase, longe, sem_meta };
        },

        pctStr(real, meta) {
            if (!meta || meta <= 0) return '';
            return ((real / meta) * 100).toFixed(1) + '% da meta';
        },

        pctClass(real, meta) {
            if (!meta || meta <= 0) return '';
            const p = (real / meta) * 100;
            if (p >= 100) return 'pct-ok';
            if (p >= 80)  return 'pct-near';
            return 'pct-bad';
        },

        badgeClass(status) {
            return {
                'badge-bateu':    status === 'bateu',
                'badge-quase':    status === 'quase',
                'badge-longe':    status === 'longe',
                'badge-sem-meta': status === 'sem_meta',
            };
        },

        badgeIcon(status) {
            return { bateu: '✓', quase: '~', longe: '!', sem_meta: '—' }[status] || '';
        },

        badgeLabel(status) {
            return {
                bateu:    'Parabéns, meta batida! 🎉',
                quase:    'Falta pouco, você consegue! 💪',
                longe:    'Bora virar o jogo! 🚀',
                sem_meta: 'Sem Meta',
            }[status] || '';
        },

        async enviarSlackSetor(s, btn) {
            if (!this.podeEnviar()) return;
            const orig = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳';
            try {
                const r = await fetch('/api/slack/enviar-meta', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.montarPayload(s)),
                });
                const data = await r.json();
                if (data.ok) {
                    this.enviados[s.setor] = true;
                    btn.textContent = '✓';
                    btn.style.color = '#4ade80';
                } else {
                    btn.textContent = '✗';
                    btn.style.color = '#f87171';
                }
            } catch(e) {
                btn.textContent = '✗';
                btn.style.color = '#f87171';
            }
            setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.disabled = false; }, 3000);
        },

        async enviarSlackTodos(btn) {
            if (!this.podeEnviar()) return;
            const tipo = this.modoEfetivo() === 'diario' ? 'a META DIÁRIA (ritmo do dia)' : 'a META DO CICLO (resultado geral)';
            if (!confirm(`Enviar ${tipo} via Slack para todas as ${this.dados.length} supervisoras?`)) return;
            const origText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Enviando...';
            let ok = 0, erro = 0;
            for (const s of this.dados) {
                try {
                    const r = await fetch('/api/slack/enviar-meta', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(this.montarPayload(s)),
                    });
                    const data = await r.json();
                    if (data.ok) { ok++; this.enviados[s.setor] = true; } else erro++;
                } catch(e) { erro++; }
                btn.innerHTML = `⏳ ${ok + erro}/${this.dados.length}`;
            }
            btn.innerHTML = erro === 0 ? `✓ ${ok} enviadas!` : `✓${ok} ✗${erro}`;
            btn.style.background = erro === 0
                ? 'linear-gradient(135deg,#059669,#10b981)'
                : 'linear-gradient(135deg,#b45309,#d97706)';
            setTimeout(() => { btn.innerHTML = origText; btn.style.background = ''; btn.disabled = false; }, 5000);
        },

        async exportarExcel(btn) {
            // Conta setores com meta cadastrada (os únicos que serão exportados)
            const comMeta = this.dados.filter(s => s.meta_planilha).length;
            if (comMeta === 0) {
                alert('Nenhum setor com meta cadastrada para exportar.');
                return;
            }

            const origHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '⏳ Gerando...';
            try {
                const params = new URLSearchParams();
                if (this.filtros.ciclo)    params.set('ciclos',    this.filtros.ciclo);
                if (this.filtros.gerencia) params.set('gerencias', this.filtros.gerencia);

                const res = await fetch('/api/metas/export?' + params);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || 'Falha ao exportar');
                }
                const blob = await res.blob();
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement('a');
                a.href = url;
                a.download = 'metas_por_setor.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
                btn.innerHTML = '✓ Exportado!';
            } catch (e) {
                console.error('Erro ao exportar Excel:', e);
                btn.innerHTML = '✗ Erro';
            } finally {
                setTimeout(() => { btn.innerHTML = origHTML; btn.disabled = false; }, 3000);
            }
        },

        imprimirSetor(s) {
            const me = this.metaEfetiva.bind(this);
            const f  = this.fmt;

            const pct = (real, meta) => meta > 0 ? ((real / meta) * 100) : null;
            const pctFmt = (real, meta) => {
                const p = pct(real, meta);
                return p !== null ? p.toFixed(1) + '%' : '—';
            };
            const cor = (real, meta) => {
                const p = pct(real, meta);
                if (p === null) return '#94a3b8';
                if (p >= 100)  return '#4ade80';
                if (p >= 60)   return '#fbbf24';
                return '#f87171';
            };
            const barra = (real, meta) => {
                const p = pct(real, meta);
                if (p === null) return 0;
                return Math.min(100, p).toFixed(1);
            };
            const statusLabel = { bateu: 'Parabéns, meta batida! 🎉', quase: 'Falta pouco, você consegue! 💪', longe: 'Bora virar o jogo! 🚀', sem_meta: 'Sem Meta' };
            const statusCor   = { bateu: '#4ade80', quase: '#fbbf24', longe: '#f87171', sem_meta: '#64748b' };

            const indicadores = [
                { label: 'Receita',          real: f.currency(s.receita),             meta: me(s,'receita'),             metaFmt: v => f.currency(v) },
                { label: 'Clientes Ativos',  real: f.number(s.clientes_ativos),        meta: me(s,'clientes_ativos'),     metaFmt: v => f.number(v)   },
                { label: 'RPA',              real: f.currency(s.rpa),                  meta: me(s,'rpa'),                 metaFmt: v => f.currency(v) },
                { label: 'Multimarca %',     real: f.percent(s.percent_multimarcas),   meta: me(s,'percent_multimarcas'), metaFmt: v => f.percent(v)  },
                { label: 'IAF Cabelo %',     real: f.percent(s.percent_cabelos),       meta: me(s,'percent_cabelos'),     metaFmt: v => f.percent(v)  },
                { label: 'IAF Make %',       real: f.percent(s.percent_make),          meta: me(s,'percent_make'),        metaFmt: v => f.percent(v)  },
            ];

            const cardsHtml = indicadores.map(ind => {
                const realNum = parseFloat(ind.real.replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
                const metaVal = ind.meta;
                const p       = metaVal ? pct(parseFloat(String(ind.real).replace(/[^\d,.-]/g,'').replace(',','.')) || 0, metaVal) : null;
                const barPct  = metaVal ? Math.min(100, (p || 0)) : 0;
                const c       = metaVal ? cor(0, 1) : '#64748b'; // placeholder

                // Recalculate properly using the raw numeric fields
                const realNumMap = {
                    'Receita': s.receita, 'Clientes Ativos': s.clientes_ativos,
                    'RPA': s.rpa, 'Multimarca %': s.percent_multimarcas,
                    'IAF Cabelo %': s.percent_cabelos, 'IAF Make %': s.percent_make,
                };
                const realN  = realNumMap[ind.label] || 0;
                const pVal   = metaVal ? pct(realN, metaVal) : null;
                const barW   = metaVal ? Math.min(100, (pVal || 0)).toFixed(1) : 0;
                const corVal = metaVal ? cor(realN, metaVal) : '#64748b';

                return `
                <div style="background:#1e1e2d;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px;">
                    <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px;">${ind.label}</div>
                    <div style="font-size:22px;font-weight:700;color:#f8fafc;font-family:monospace;margin-bottom:4px;">${ind.real}</div>
                    ${metaVal ? `
                    <div style="font-size:11px;color:#64748b;margin-bottom:8px;">meta: ${ind.metaFmt(metaVal)}</div>
                    <div style="background:rgba(255,255,255,0.06);border-radius:99px;height:6px;overflow:hidden;margin-bottom:4px;">
                        <div style="height:100%;width:${barW}%;background:${corVal};border-radius:99px;transition:width 0.3s;"></div>
                    </div>
                    <div style="font-size:12px;font-weight:700;color:${corVal};">${pVal !== null ? pVal.toFixed(1) + '% da meta' : '—'}</div>
                    ` : '<div style="font-size:11px;color:#475569;margin-top:4px;">Sem meta definida</div>'}
                </div>`;
            }).join('');

            const data = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
            const stCor = statusCor[s._status] || '#64748b';
            const stLbl = statusLabel[s._status] || '—';

            const nomeArquivo = s.setor.replace(/[^a-z0-9]/gi, '_').toLowerCase();

            const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meta — ${s.setor}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f0f1a; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:24px; }
  .actions { display:flex; gap:10px; margin-bottom:20px; justify-content:flex-end; }
  .btn-action {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; border:none; transition:opacity 0.2s;
  }
  .btn-action:hover { opacity:0.85; }
  .btn-print { background:linear-gradient(135deg,#6d28d9,#db2777); color:#fff; }
  .btn-img   { background:rgba(255,255,255,0.08); color:#e2e8f0; border:1px solid rgba(255,255,255,0.15) !important; }
  .btn-img:disabled { opacity:0.5; cursor:wait; }
  .btn-slack { background:linear-gradient(135deg,#4A154B,#7B2FBE); color:#fff; }
  .btn-slack:disabled { opacity:0.5; cursor:wait; }
  @media print { .actions { display:none !important; } * { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
<div style="max-width:780px;margin:0 auto;">

  <!-- Ações -->
  <div class="actions">
    <button class="btn-action btn-img" id="btnImg" onclick="salvarImagem()">📷 Salvar como PNG</button>
    <button class="btn-action btn-slack" id="btnSlack" onclick="enviarSlack()">💬 Enviar via Slack (${this.modoEfetivo() === 'diario' ? 'meta diária' : 'meta do ciclo'})</button>
    <button class="btn-action btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>

  <!-- Card principal -->
  <div id="card">
    <div style="background:linear-gradient(135deg,#6d28d9,#db2777);border-radius:16px;padding:24px 28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;">Multimarks Analytics · Meta por Setor</div>
        <div style="font-size:22px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:4px;">${s.setor}</div>
        ${s.supervisora ? `<div style="font-size:14px;color:rgba(255,255,255,0.8);">Supervisora: <strong>${s.supervisora}</strong></div>` : ''}
      </div>
      <div style="text-align:right;">
        <div style="display:inline-block;background:${stCor}22;border:1px solid ${stCor}55;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;color:${stCor};">${stLbl}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:8px;">${data}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
      ${cardsHtml}
    </div>

    <div style="text-align:center;margin-top:20px;font-size:10px;color:#475569;">
      Gerado por Multimarks Analytics · ${data}
    </div>
  </div>
</div>

<script>
const _mp = ${JSON.stringify(s.meta_planilha || {})};
const _slackMeta = {
    setor: ${JSON.stringify(s.setor)},
    supervisora: ${JSON.stringify(s.supervisora || '')},
    base: '${window.location.origin}',
    dados: {
        status: ${JSON.stringify(s._status || '')},
        receita: ${s.receita || 0},
        meta_receita: ${JSON.stringify(s.meta_planilha && s.meta_planilha.receita ? s.meta_planilha.receita : null)},
        clientes_ativos: ${s.clientes_ativos || 0},
        meta_ativo: ${JSON.stringify(s.meta_planilha && s.meta_planilha.clientes_ativos ? s.meta_planilha.clientes_ativos : null)},
        rpa: ${s.rpa || 0},
        meta_rpa: ${JSON.stringify(s.meta_planilha && s.meta_planilha.rpa ? s.meta_planilha.rpa : null)},
        multimarca: ${s.percent_multimarcas || 0},
        meta_multimarca: ${JSON.stringify(s.meta_planilha && s.meta_planilha.percent_multimarcas ? s.meta_planilha.percent_multimarcas : null)},
        cabelos: ${s.percent_cabelos || 0},
        meta_cabelos: ${JSON.stringify(s.meta_planilha && s.meta_planilha.percent_cabelos ? s.meta_planilha.percent_cabelos : null)},
        make: ${s.percent_make || 0},
        meta_make: ${JSON.stringify(s.meta_planilha && s.meta_planilha.percent_make ? s.meta_planilha.percent_make : null)},
        clientes_multimarcas: ${s.clientes_multimarcas || 0},
        meta_multimarca_qtd: ${JSON.stringify(s.meta_planilha && s.meta_planilha.clientes_multimarcas ? s.meta_planilha.clientes_multimarcas : null)},
        clientes_cabelos: ${s.clientes_cabelos || 0},
        meta_cabelos_qtd: ${JSON.stringify(s.meta_planilha && s.meta_planilha.clientes_cabelos ? s.meta_planilha.clientes_cabelos : null)},
        clientes_make: ${s.clientes_make || 0},
        meta_make_qtd: ${JSON.stringify(s.meta_planilha && s.meta_planilha.clientes_make ? s.meta_planilha.clientes_make : null)},
        hoje: ${JSON.stringify(s.hoje || null)},
        planilha: ${JSON.stringify(this.periodo || null)},
    },
    modo: ${JSON.stringify(this.modoEfetivo())},
    ciclo: ${JSON.stringify(this.cicloEnvio())},
    data_ref: ${JSON.stringify(this.envio.dataRef || null)},
};
function salvarImagem() {
    const btn = document.getElementById('btnImg');
    btn.disabled = true;
    btn.textContent = 'Gerando...';
    html2canvas(document.getElementById('card'), {
        scale: 2,
        backgroundColor: '#0f0f1a',
        useCORS: true,
        logging: false,
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'meta_${nomeArquivo}.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.disabled = false;
        btn.textContent = '📷 Salvar como PNG';
    });
}
function enviarSlack() {
    const btn = document.getElementById('btnSlack');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    fetch(_slackMeta.base + '/api/slack/enviar-meta', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({supervisora: _slackMeta.supervisora, setor: _slackMeta.setor, dados: _slackMeta.dados,
                              modo: _slackMeta.modo, ciclo: _slackMeta.ciclo, data_ref: _slackMeta.data_ref}),
    }).then(r => r.json()).then(data => {
        btn.disabled = false;
        if (data.ok) {
            btn.style.background = 'linear-gradient(135deg,#059669,#10b981)';
            btn.textContent = '✓ Enviado!';
        } else {
            btn.textContent = '✗ Erro';
            console.error(data);
        }
        setTimeout(() => { btn.textContent = '💬 Enviar via Slack'; btn.style.background = ''; }, 4000);
    }).catch(err => {
        btn.disabled = false;
        btn.textContent = '✗ Erro';
        console.error(err);
        setTimeout(() => { btn.textContent = '💬 Enviar via Slack'; }, 4000);
    });
}
<\/script>
</body>
</html>`;

            const win = window.open('', '_blank', 'width=860,height=700');
            win.document.write(html);
            win.document.close();
        },

        imprimirTodos() {
            if (!this.dados.length) return;

            const gerarCard = (s) => {
                const f   = this.fmt;
                const me  = (campo) => this.metaEfetiva(s, campo);
                const pct = (real, meta) => meta > 0 ? (real / meta) * 100 : null;
                const corVal = (real, meta) => {
                    const p = pct(real, meta);
                    if (p === null) return '#94a3b8';
                    if (p >= 100) return '#4ade80';
                    if (p >= 60)  return '#fbbf24';
                    return '#f87171';
                };

                const statusLabel = { bateu: 'Parabéns, meta batida! 🎉', quase: 'Falta pouco, você consegue! 💪', longe: 'Bora virar o jogo! 🚀', sem_meta: 'Sem Meta' };
                const statusCor   = { bateu: '#4ade80', quase: '#fbbf24', longe: '#f87171', sem_meta: '#64748b' };
                const stCor = statusCor[s._status] || '#64748b';
                const stLbl = statusLabel[s._status] || '—';

                const indicadores = [
                    { label: 'Receita',         realN: s.receita,             realFmt: f.currency(s.receita),           meta: me('receita'),             metaFmt: v => f.currency(v) },
                    { label: 'Clientes Ativos', realN: s.clientes_ativos,     realFmt: f.number(s.clientes_ativos),     meta: me('clientes_ativos'),     metaFmt: v => f.number(v)   },
                    { label: 'RPA',             realN: s.rpa,                  realFmt: f.currency(s.rpa),               meta: me('rpa'),                 metaFmt: v => f.currency(v) },
                    { label: 'Multimarca %',    realN: s.percent_multimarcas,  realFmt: f.percent(s.percent_multimarcas),meta: me('percent_multimarcas'), metaFmt: v => f.percent(v)  },
                    { label: 'IAF Cabelo %',    realN: s.percent_cabelos,      realFmt: f.percent(s.percent_cabelos),    meta: me('percent_cabelos'),     metaFmt: v => f.percent(v)  },
                    { label: 'IAF Make %',      realN: s.percent_make,         realFmt: f.percent(s.percent_make),       meta: me('percent_make'),        metaFmt: v => f.percent(v)  },
                ];

                const cardsHtml = indicadores.map(ind => {
                    const pVal = ind.meta ? pct(ind.realN, ind.meta) : null;
                    const barW = pVal !== null ? Math.min(100, pVal).toFixed(1) : 0;
                    const c    = ind.meta ? corVal(ind.realN, ind.meta) : '#64748b';
                    return `
                    <div style="background:#1e1e2d;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px;">
                        <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;">${ind.label}</div>
                        <div style="font-size:18px;font-weight:700;color:#f8fafc;font-family:monospace;margin-bottom:3px;">${ind.realFmt}</div>
                        ${ind.meta ? `
                        <div style="font-size:10px;color:#64748b;margin-bottom:6px;">meta: ${ind.metaFmt(ind.meta)}</div>
                        <div style="background:rgba(255,255,255,0.06);border-radius:99px;height:5px;overflow:hidden;margin-bottom:3px;">
                            <div style="height:100%;width:${barW}%;background:${c};border-radius:99px;"></div>
                        </div>
                        <div style="font-size:11px;font-weight:700;color:${c};">${pVal !== null ? pVal.toFixed(1) + '% da meta' : '—'}</div>
                        ` : '<div style="font-size:10px;color:#475569;margin-top:4px;">Sem meta definida</div>'}
                    </div>`;
                }).join('');

                return `
                <div style="page-break-after:always;padding-bottom:8px;">
                    <div style="background:linear-gradient(135deg,#6d28d9,#db2777);border-radius:14px;padding:20px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-start;">
                        <div>
                            <div style="font-size:10px;font-weight:600;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;">Multimarks Analytics · Meta por Setor</div>
                            <div style="font-size:19px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:3px;">${s.setor}</div>
                            ${s.supervisora ? `<div style="font-size:13px;color:rgba(255,255,255,0.8);">Supervisora: <strong>${s.supervisora}</strong></div>` : ''}
                        </div>
                        <div style="text-align:right;">
                            <div style="display:inline-block;background:${stCor}22;border:1px solid ${stCor}55;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;color:${stCor};">${stLbl}</div>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
                        ${cardsHtml}
                    </div>
                </div>`;
            };

            const data    = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
            const filtro  = this.filtros.gerencia ? ` · Gerência ${this.filtros.gerencia}` : '';
            const ciclo   = this.filtros.ciclo    ? ` · Ciclo ${this.filtros.ciclo}`       : '';
            const resumo  = `${this.dados.length} setores${filtro}${ciclo} · ${data}`;

            const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Metas por Setor — ${data}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f0f1a; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:24px; }
  .actions { display:flex; gap:10px; margin-bottom:20px; justify-content:flex-end; }
  .btn-action { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:opacity 0.2s; }
  .btn-action:hover { opacity:0.85; }
  .btn-print { background:linear-gradient(135deg,#6d28d9,#db2777); color:#fff; }
  .btn-img   { background:rgba(255,255,255,0.08); color:#e2e8f0; border:1px solid rgba(255,255,255,0.15) !important; }
  .btn-img:disabled { opacity:0.5; cursor:wait; }
  .btn-slack { background:linear-gradient(135deg,#4A154B,#7B2FBE); color:#fff; }
  .btn-slack:disabled { opacity:0.5; cursor:wait; }
  @media print { .actions { display:none !important; } * { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
<div style="max-width:780px;margin:0 auto;">

  <div class="actions">
    <button class="btn-action btn-img" id="btnImg" onclick="salvarImagem()">📷 Salvar como PNG</button>
    <button class="btn-action btn-slack" id="btnSlack" onclick="enviarSlack()">💬 Enviar via Slack</button>
    <button class="btn-action btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
  </div>

  <div id="conteudo">
    <div style="text-align:center;margin-bottom:24px;padding:12px;background:rgba(139,92,246,0.1);border-radius:10px;border:1px solid rgba(139,92,246,0.2);">
      <div style="font-size:16px;font-weight:800;color:#a78bfa;margin-bottom:4px;">Relatório de Metas por Setor</div>
      <div style="font-size:11px;color:#64748b;">${resumo}</div>
    </div>
    ${this.dados.map(s => gerarCard(s)).join('')}
  </div>
</div>

<script>
const _slackBase = '${window.location.origin}';
function salvarImagem() {
    const btn = document.getElementById('btnImg');
    btn.disabled = true;
    btn.textContent = 'Gerando...';
    html2canvas(document.getElementById('conteudo'), {
        scale: 2,
        backgroundColor: '#0f0f1a',
        useCORS: true,
        logging: false,
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'metas_todos_setores.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.disabled = false;
        btn.textContent = '📷 Salvar como PNG';
    });
}
function enviarSlack() {
    const btn = document.getElementById('btnSlack');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    fetch(_slackBase + '/api/slack/enviar-meta', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({supervisora: '', setor: 'Resumo — Todos os Setores', dados: {status: ''}}),
    }).then(r => r.json()).then(data => {
        btn.disabled = false;
        if (data.ok) {
            btn.style.background = 'linear-gradient(135deg,#059669,#10b981)';
            btn.textContent = '✓ Enviado!';
        } else {
            btn.textContent = '✗ Erro';
        }
        setTimeout(() => { btn.textContent = '💬 Enviar via Slack'; btn.style.background = ''; }, 4000);
    }).catch(() => {
        btn.disabled = false;
        btn.textContent = '✗ Erro';
        setTimeout(() => { btn.textContent = '💬 Enviar via Slack'; }, 4000);
    });
}
<\/script>
</body>
</html>`;

            const win = window.open('', '_blank', 'width=860,height=700');
            win.document.write(html);
            win.document.close();
        },
    };
}
</script>
